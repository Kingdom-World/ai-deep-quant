# CI 质量门禁（评审 P0-T8）
# 背景：仓库有 30+ 单测但无强制执行点，回归靠手跑。PR/push 时自动运行
# 单测 + TypeScript 检查，红灯即阻断合并。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必须与 package.json engines（24.x）及 Vercel 构建版对齐。
          # 曾用 20：test runner 不识别带引号的 glob（"test/*.test.cjs"），CI 连续 40+ 次红。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (node --test)
        # 🔴 失败时把「not ok 清单 + 末 200 行输出 + 运行环境」写进 job summary。
        #   为什么不只写 not ok 清单：本地复现失败的**主要障碍**是读不到日志
        #   （/actions/jobs/<id>/logs 对非 admin 返回 403），只有 summary 公开可读。
        #   为什么加「运行环境」：Node 大版本差异会造出第二类"只在本地成立"的失败，
        #   记录下来才能一眼看出是版本问题还是代码问题。
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-out.txt || {
            {
              echo "## Unit test failure"
              echo "- node: \`$(node -v)\`"
              echo "- runner: \`$RUNNER_OS\`, node 期望 \`24\`"
              echo "- commit: \`$GITHUB_SHA\`"
              echo
              echo "### not ok 清单"
              echo '```'
              grep -E "^not ok" /tmp/test-out.txt | head -30 || echo "(无 not ok 行 —— 可能是进程异常退出/超时，非断言失败)"
              echo '```'
              echo
              echo '<details><summary>最后 200 行原始输出</summary>'
              echo '```'
              tail -200 /tmp/test-out.txt
              echo '```'
              echo '</details>'
              echo
              echo '<details><summary>环境（node -p 关键项）</summary>'
              echo '```'
              node -p "JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,cpus:require('os').cpus().length,tmpdir:require('os').tmpdir()})"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Knowledge source integrity (offline)
        # 🔴 为什么加这一步（2026-10-09）：
        #   知识库当周连续出现四类真缺陷 —— 幻觉引用、DOI 挂到另一篇论文、
        #   两篇论文共用一个 DOI、官方标题与正式标题不符。根因是写入路径无拦截。
        #   `verify-sources.cjs` 能抓这些，但它是**联网**工具，
        #   Crossref 限流/抖动会让 CI 因"内容其实没问题"而红 ⇒ 不适合进 CI。
        #   本步骤是**纯离线**自洽门（唯一 DOI 不跨标题/跨年份、DOI 形态、
        #   说明文字不得混入 source），可安全阻断。
        # ⚠️ 它**抓不到**幻觉引用（文献不存在但格式合规）——
        #   那必须联网核验，仍在本地跑、由人判断。这是它的能力边界，不是遗漏。
        run: node tools/check-source-integrity.cjs --ci

      - name: Public docs guard (offline)
        # 🔴 仓库是 public，而README 曾经对外写了：鉴权变量名 +「密码留空即关闭」
        #   + 真实部署地址 + 部署拓扑 + 内部阈值第二份副本。
        #   每一处单看都像正常文档 ⇒ 人工逐行审会漏。
        #   本步骤断言「公开面不得出现什么」，只扫**公开版 README**
        #   （本地完整版不入库、不受约束）⇒ 改动对外文档即刻验证。
        run: node tools/check-public-docs.cjs --ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build (vite)
        run: npx vite build
